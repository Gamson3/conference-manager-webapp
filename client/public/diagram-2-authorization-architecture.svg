<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <style>
      .layer-header { font-size: 18px; font-weight: bold; fill: #1a1a1a; }
      .box-title { font-size: 16px; font-weight: bold; fill: white; }
      .box-text { font-size: 13px; fill: white; }
      .flow-label { font-size: 12px; fill: #333; font-weight: 500; }
      .decision-label { font-size: 11px; fill: #333; }
      .arrow { stroke: #333; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .arrow-label { font-size: 12px; fill: #666; font-weight: 500; }
      .role-badge { font-size: 11px; font-weight: bold; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#333" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="800" fill="#f8f9fa"/>

  <!-- Title -->
  <text x="600" y="35" style="font-size: 28px; font-weight: bold; text-anchor: middle; fill: #1a1a1a;">Authorization Architecture (Two-Layer Model)</text>

  <!-- ============ LAYER 1: FRONTEND ============ -->
  <text x="60" y="80" class="layer-header">LAYER 1: FRONTEND (Browser)</text>
  
  <!-- User Interface -->
  <rect x="50" y="100" width="220" height="100" rx="8" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
  <text x="160" y="130" class="box-title" text-anchor="middle">User Interface</text>
  <text x="160" y="150" class="box-text" text-anchor="middle" style="font-size: 12px;">Click Conference</text>
  <text x="160" y="165" class="box-text" text-anchor="middle" style="font-size: 12px;">Create/Edit Actions</text>
  <text x="160" y="180" class="box-text" text-anchor="middle" style="font-size: 12px;">Request Data</text>

  <!-- Frontend Guards -->
  <rect x="310" y="100" width="220" height="100" rx="8" fill="#8b5cf6" stroke="#6d28d9" stroke-width="2"/>
  <text x="420" y="130" class="box-title" text-anchor="middle">Frontend Guards</text>
  <text x="420" y="150" class="box-text" text-anchor="middle" style="font-size: 12px;">OrganizerGuard</text>
  <text x="420" y="165" class="box-text" text-anchor="middle" style="font-size: 12px;">AdminGuard</text>
  <text x="420" y="180" class="box-text" text-anchor="middle" style="font-size: 12px;">Check local role</text>

  <!-- JWT Token -->
  <rect x="570" y="100" width="220" height="100" rx="8" fill="#06b6d4" stroke="#0891b2" stroke-width="2"/>
  <text x="680" y="130" class="box-title" text-anchor="middle">JWT Token</text>
  <text x="680" y="150" class="box-text" text-anchor="middle" style="font-size: 12px;">Contains: user ID</text>
  <text x="680" y="165" class="box-text" text-anchor="middle" style="font-size: 12px;">Verifies: Identity</text>
  <text x="680" y="180" class="box-text" text-anchor="middle" style="font-size: 12px;">NOT Authorization</text>

  <!-- Arrows between frontend components -->
  <path d="M 270 150 L 310 150" class="arrow"/>
  <text x="285" y="145" class="arrow-label">passes</text>

  <path d="M 530 150 L 570 150" class="arrow"/>
  <text x="540" y="145" class="arrow-label">attaches</text>

  <!-- ============ NETWORK CALL ============ -->
  <path d="M 680 200 L 680 240" class="arrow" stroke-width="3" stroke="#ec4899"/>
  <text x="720" y="225" class="arrow-label" style="fill: #ec4899; font-weight: bold;">HTTPS Request</text>
  <text x="720" y="240" class="arrow-label" style="fill: #ec4899; font-size: 10px;">+ JWT in header</text>

  <!-- ============ LAYER 2: BACKEND MIDDLEWARE ============ -->
  <text x="60" y="280" class="layer-header">LAYER 2: BACKEND MIDDLEWARE</text>

  <!-- authMiddleware -->
  <rect x="570" y="300" width="260" height="140" rx="8" fill="#f59e0b" stroke="#d97706" stroke-width="2"/>
  <text x="700" y="325" class="box-title" text-anchor="middle">authMiddleware</text>
  <text x="700" y="350" class="box-text" text-anchor="middle" style="font-size: 12px;">① Verify JWT signature</text>
  <text x="700" y="368" class="box-text" text-anchor="middle" style="font-size: 12px;">② Extract user ID from token</text>
  <text x="700" y="386" class="box-text" text-anchor="middle" style="font-size: 12px;">③ Query DB: user.role</text>
  <text x="700" y="404" class="box-text" text-anchor="middle" style="font-size: 12px;">④ Attach to req.user.role</text>
  <text x="700" y="422" class="box-text" text-anchor="middle" style="font-size: 11px; fill: #fff3cd;">🔒 SOURCE OF TRUTH: DATABASE</text>

  <!-- Key Innovation Badge -->
  <rect x="570" y="450" width="260" height="50" rx="8" fill="#10b981" stroke="#059669" stroke-width="3"/>
  <text x="700" y="472" class="box-text" text-anchor="middle" style="font-size: 13px; font-weight: bold;">⭐ RESEARCH INNOVATION</text>
  <text x="700" y="492" class="box-text" text-anchor="middle" style="font-size: 11px;">Role verified from DB, NOT from JWT</text>

  <!-- Arrow -->
  <path d="M 680 240 L 680 300" class="arrow" stroke-width="3" stroke="#ec4899"/>

  <!-- ============ LAYER 3: CONTROLLERS & ROUTES ============ -->
  <text x="60" y="540" class="layer-header">LAYER 3: CONTROLLERS &amp; ROUTES</text>

  <!-- Route Handlers -->
  <rect x="50" y="560" width="220" height="120" rx="8" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
  <text x="160" y="585" class="box-title" text-anchor="middle">Route Handlers</text>
  <text x="160" y="610" class="box-text" text-anchor="middle" style="font-size: 12px;">Check role from</text>
  <text x="160" y="625" class="box-text" text-anchor="middle" style="font-size: 12px;">req.user.role</text>
  <text x="160" y="640" class="box-text" text-anchor="middle" style="font-size: 12px;">(freshly from DB)</text>
  <text x="160" y="655" class="box-text" text-anchor="middle" style="font-size: 12px;">Route to handler</text>

  <!-- Controllers -->
  <rect x="310" y="560" width="220" height="120" rx="8" fill="#8b5cf6" stroke="#6d28d9" stroke-width="2"/>
  <text x="420" y="585" class="box-title" text-anchor="middle">Controllers</text>
  <text x="420" y="610" class="box-text" text-anchor="middle" style="font-size: 12px;">Access control logic</text>
  <text x="420" y="625" class="box-text" text-anchor="middle" style="font-size: 12px;">Check ownership</text>
  <text x="420" y="640" class="box-text" text-anchor="middle" style="font-size: 12px;">Verify capabilities</text>
  <text x="420" y="655" class="box-text" text-anchor="middle" style="font-size: 12px;">Execute operation</text>

  <!-- Database Query -->
  <rect x="570" y="560" width="260" height="120" rx="8" fill="#06b6d4" stroke="#0891b2" stroke-width="2"/>
  <text x="700" y="585" class="box-title" text-anchor="middle">Database Query</text>
  <text x="700" y="610" class="box-text" text-anchor="middle" style="font-size: 12px;">Query Participant table:</text>
  <text x="700" y="625" class="box-text" text-anchor="middle" style="font-size: 12px;">capability (author,</text>
  <text x="700" y="640" class="box-text" text-anchor="middle" style="font-size: 12px;">presenter, reviewer,</text>
  <text x="700" y="655" class="box-text" text-anchor="middle" style="font-size: 12px;">sponsor, volunteer)</text>

  <!-- Arrows -->
  <path d="M 700 300 L 160 560" class="arrow"/>
  <path d="M 700 300 L 420 560" class="arrow"/>
  <path d="M 700 300 L 700 560" class="arrow"/>

  <!-- ============ LAYER 4: DATABASE (PostgreSQL) ============ -->
  <text x="60" y="720" class="layer-header">LAYER 4: DATABASE (PostgreSQL)</text>

  <!-- User Table -->
  <rect x="50" y="740" width="200" height="50" rx="8" fill="#10b981" stroke="#059669" stroke-width="2"/>
  <text x="150" y="760" class="box-title" text-anchor="middle" style="font-size: 14px;">User Table</text>
  <text x="150" y="777" class="box-text" text-anchor="middle" style="font-size: 11px;">id, email, role (user|organizer|admin)</text>

  <!-- Conference Table -->
  <rect x="310" y="740" width="200" height="50" rx="8" fill="#10b981" stroke="#059669" stroke-width="2"/>
  <text x="410" y="760" class="box-title" text-anchor="middle" style="font-size: 14px;">Conference Table</text>
  <text x="410" y="777" class="box-text" text-anchor="middle" style="font-size: 11px;">id, organizerId, title, status</text>

  <!-- Participant Table (Two-Layer) -->
  <rect x="570" y="740" width="260" height="50" rx="8" fill="#ec4899" stroke="#be185d" stroke-width="2"/>
  <text x="700" y="760" class="box-title" text-anchor="middle" style="font-size: 14px;">Participant Table (Contextual Roles)</text>
  <text x="700" y="777" class="box-text" text-anchor="middle" style="font-size: 11px;">userId, conferenceId, capability (author|presenter|...)</text>

  <!-- Legend Box -->
  <rect x="890" y="100" width="290" height="690" rx="8" fill="#fff" stroke="#ccc" stroke-width="2"/>
  
  <text x="1035" y="130" style="font-size: 16px; font-weight: bold; text-anchor: middle; fill: #1a1a1a;">TWO-LAYER MODEL</text>

  <!-- Layer 1 Legend -->
  <rect x="910" y="150" width="250" height="2" fill="#3b82f6"/>
  <text x="920" y="175" style="font-size: 13px; font-weight: bold; fill: #1a1a1a;">Layer 1: Global Roles</text>
  <text x="920" y="195" style="font-size: 11px; fill: #333;">Stored in: User.role</text>
  <text x="920" y="212" class="role-badge" fill="#3b82f6;">• user</text>
  <text x="920" y="230" class="role-badge" fill="#3b82f6;">• organizer</text>
  <text x="920" y="248" class="role-badge" fill="#3b82f6;">• admin</text>

  <text x="920" y="270" style="font-size: 11px; fill: #666;">Controls: System-wide</text>
  <text x="920" y="285" style="font-size: 11px; fill: #666;">access level</text>

  <!-- Layer 2 Legend -->
  <rect x="910" y="310" width="250" height="2" fill="#ec4899"/>
  <text x="920" y="335" style="font-size: 13px; font-weight: bold; fill: #1a1a1a;">Layer 2: Contextual Capabilities</text>
  <text x="920" y="355" style="font-size: 11px; fill: #333;">Stored in: Participant.capability</text>
  <text x="920" y="372" class="role-badge" fill="#ec4899;">• author</text>
  <text x="920" y="390" class="role-badge" fill="#ec4899;">• presenter</text>
  <text x="920" y="408" class="role-badge" fill="#ec4899;">• reviewer</text>
  <text x="920" y="426" class="role-badge" fill="#ec4899;">• sponsor</text>
  <text x="920" y="444" class="role-badge" fill="#ec4899;">• volunteer</text>

  <text x="920" y="466" style="font-size: 11px; fill: #666;">Controls: Per-conference</text>
  <text x="920" y="481" style="font-size: 11px; fill: #666;">specific actions</text>

  <!-- Flow Summary -->
  <rect x="910" y="510" width="250" height="2" fill="#f59e0b"/>
  <text x="920" y="535" style="font-size: 13px; font-weight: bold; fill: #1a1a1a;">Authorization Flow</text>
  <text x="920" y="555" style="font-size: 11px; fill: #333;">1. Frontend checks global role</text>
  <text x="920" y="572" style="font-size: 11px; fill: #333;">2. Middleware re-verifies from DB</text>
  <text x="920" y="589" style="font-size: 11px; fill: #333;">3. Controller checks global role</text>
  <text x="920" y="606" style="font-size: 11px; fill: #333;">4. Database lookup of contextual</text>
  <text x="920" y="621" style="font-size: 11px; fill: #333;">   capability for final decision</text>

  <!-- Defense in Depth -->
  <rect x="910" y="650" width="250" height="120" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="1035" y="675" style="font-size: 12px; font-weight: bold; text-anchor: middle; fill: #1a1a1a;">Defense-in-Depth</text>
  <text x="920" y="695" style="font-size: 10px; fill: #333;">✓ JWT validates identity</text>
  <text x="920" y="710" style="font-size: 10px; fill: #333;">✓ Middleware validates role</text>
  <text x="920" y="725" style="font-size: 10px; fill: #333;">✓ Controller verifies capability</text>
  <text x="920" y="740" style="font-size: 10px; fill: #333;">✓ DB enforces constraints</text>
</svg>